<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កំណត់ពេលប្រកួតបាល់ទះ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f9);
            --text-color: var(--tg-theme-text-color, #2c3e50);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --button-bg: var(--tg-theme-button-color, #27ae60);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --accent-color: #3498db;
        }

        body {
            font-family: 'Khmer OS Battambang', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 340px;
            text-align: left;
        }

        .header-icon {
            font-size: 32px;
            text-align: center;
            margin-bottom: 8px;
        }

        h3 {
            text-align: center;
            margin: 0 0 4px 0;
            font-size: 20px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            background-color: rgba(0, 0, 0, 0.02);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="date"]:focus,
        input[type="time"]:focus {
            border-color: var(--accent-color);
            background-color: transparent;
        }

        .submit-btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .submit-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 12px;
            text-align: left;
            margin-top: 10px;
            min-height: 16px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-icon">🏐</div>
        <h3>កំណត់ពេលប្រកួត</h3>
        <div class="subtitle">ជ្រើសរើសថ្ងៃ និងម៉ោងមិត្តភាពកីឡា</div>

        <div class="form-group">
            <label>📅 កាលបរិច្ឆេទ (Date)</label>
            <input type="date" id="matchDate">
        </div>

        <div class="form-group">
            <label>🟢 ម៉ោងចាប់ផ្តើម (From)</label>
            <input type="time" id="timeFrom" value="18:30">
        </div>

        <div class="form-group">
            <label>🔴 ម៉ោងបញ្ចប់ (End)</label>
            <input type="time" id="timeEnd" value="20:30">
        </div>

        <button class="submit-btn" id="saveBtn" onclick="submitData()">បញ្ជាក់ការកំណត់ (Save)</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const SERVER_URL = "https://khvolleyball-telegram-bot.onrender.com/save-time";

        document.getElementById('matchDate').valueAsDate = new Date();

        const saveBtn = document.getElementById('saveBtn');
        const errorMsg = document.getElementById('errorMsg');

        function showError(text) {
            errorMsg.textContent = text;
        }

        async function submitData() {
            errorMsg.textContent = "";

            let dateVal = document.getElementById("matchDate").value;
            let fromVal = document.getElementById("timeFrom").value;
            let endVal = document.getElementById("timeEnd").value;

            if (!dateVal || !fromVal || !endVal) {
                showError("⚠️ សូមបំពេញថ្ងៃ និងម៉ោងឱ្យបានត្រឹមត្រូវ!");
                return;
            }

            let formattedDate = formatDate(dateVal);
            let formattedFrom = convertTo12Hour(fromVal);
            let formattedEnd = convertTo12Hour(endVal);
            let formattedTime = `${formattedFrom} - ${formattedEnd}`;

            const initData = tg.initData || "";
            let ref = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) ? tg.initDataUnsafe.start_param : "";

            if (!ref && initData) {
                try {
                    ref = new URLSearchParams(initData).get("start_param") || "";
                } catch (e) {}
            }

            if (!ref) {
                let userId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "12345";
                ref = "p" + userId;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = "កំពុងរក្សាទុក...";

            try {
                const response = await fetch(SERVER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        date: formattedDate,
                        time: formattedTime,
                        ref: ref,
                        initData: initData
                    })
                });

                const result = await response.json().catch(() => ({}));

                if (response.ok && result.ok) {
                    tg.showPopup({
                        title: "ជោគជ័យ!",
                        message: "បានកំណត់ពេលប្រកួតរួចរាល់!",
                        buttons: [{type: "ok"}]
                    }, function(buttonId) {
                        tg.close();
                    });
                } else {
                    saveBtn.disabled = false;
                    saveBtn.textContent = "បញ្ជាក់ការកំណត់ (Save)";
                    showError("⚠️ មិនអាចរក្សាទុកបានទេ៖ " + (result.error || response.status));
                }
            } catch (err) {
                saveBtn.disabled = false;
                saveBtn.textContent = "បញ្ជាក់ការកំណត់ (Save)";
                showError("⚠️ មានបញ្ហាភ្ជាប់បណ្ដាញ (Network Error)");
            }
        }

        function formatDate(dateString) {
            if (!dateString) return "";
            let parts = dateString.split('-');
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function convertTo12Hour(time24) {
            if (!time24) return "";
            let [hours, minutes] = time24.split(':');
            let h = parseInt(hours);
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            h = h ? h : 12;
            let formattedH = h < 10 ? '0' + h : h;
            return `${formattedH}:${minutes} ${ampm}`;
        }
    </script>
</body>

</html>
